packages:
  - frontend
  - svelte-click-to-source

# pnpm 11+ escalates ERR_PNPM_IGNORED_BUILDS to a FATAL non-zero exit by
# default, so a clean `pnpm install --frozen-lockfile` (CI, fresh clone)
# exits 1 even though esbuild/sharp/workerd ship prebuilt platform
# binaries whose postinstall is effectively a no-op. The explicit
# allowlist below is kept for intent/audit; this stops the fatal
# escalation so the install (and every frontend CI job) succeeds.
# (Re-verified on pnpm 12.10.1, 2026-10-09: every key in this file is a
# recognized setting — pnpm 12 hard-fails on unknown workspace keys with
# ERR_PNPM_UNRECOGNIZED_WORKSPACE_SETTINGS.)
strictDepBuilds: false

# Before every `pnpm run <script>` pnpm re-verifies installed deps and,
# on any mismatch, tries to REMOVE and reinstall node_modules. In CI
# (no TTY) that abort-prompts and the whole step dies with
# ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY — this is the actual reason
# the Frontend job (check/lint/vitest/build) failed even after install
# succeeded. The lockfile is frozen in CI, so a pre-run reinstall is
# never desired. Reproduced cold and verified: with this set,
# install -> check -> lint -> vitest all pass on a clean checkout.
verifyDepsBeforeRun: false
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# pnpm's default `minimumReleaseAge` (24h) refuses versions published in the
# last day. The 2026-10-09 sweep targets the npm `latest` of every package as
# of that date, and these were all published inside that window. Each entry is
# an exact version (never a range) so the exemption cannot widen to a future
# release; prune entries once the lockfile no longer resolves them.
minimumReleaseAgeExclude:
  - '@anthropic-ai/sdk@0.133.0'
  - '@paypal/paypal-js@11.2.2'
  - '@types/node@24.19.2'
  - eslint-plugin-svelte@3.23.1

peerDependencyRules:
  allowedVersions:
    # runed (pulled in by bits-ui and svelte-toolbelt) still declares
    # `@sveltejs/kit: ^2.21.0` as of runed 0.37.1 — there is no published
    # runed that accepts Kit 3, and bits-ui 2.19.5 (latest) still depends on
    # `runed: ^0.35.1`. runed only imports `$app/environment`,
    # `$app/navigation` and `$app/state`; all three resolve on Kit 3.0.1
    # (`$app/environment` is a deprecated re-export of `$app/env`), so the
    # mismatch is a stale range, not a real break. Remove this once runed
    # widens the peer to `^2.21.0 || ^3.0.0`.
    # (Added 2026-08-30; re-verified against Kit 3.0.1 stable 2026-10-09.)
    runed>@sveltejs/kit: ^3.0.0
    # The former `vite-plugin-devtools-json>vite: ^8.0.0` rule is gone:
    # vite-plugin-devtools-json 1.1.1 declares `vite: ^5 || ^6 || ^7 || ^8`
    # itself.
